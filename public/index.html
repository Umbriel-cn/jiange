<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑阁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: "Noto Serif SC", serif;
  background: linear-gradient(to bottom,
    #06080f 0%,
    #0a1025 15%,
    #0e1a3a 35%,
    #142848 55%,
    #1d3a5c 75%,
    #284868 100%
  );
  color: rgba(232,228,223,0.9);
}

/* ── nav ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.4rem 3rem;
}
.nav-logo {
  font-size: 1.2rem; letter-spacing: 0.35em; font-weight: 600;
  color: #e8e4df; text-decoration: none;
}
.nav-links { display: flex; gap: 2.2rem; list-style: none; }
.nav-links a {
  color: #e8e4df; text-decoration: none;
  font-size: 0.82rem; letter-spacing: 0.12em;
  transition: color 0.3s;
}
.nav-links a:hover { color: #fff; }

/* ── hero ── */
.hero {
  position: relative; width: 100vw; height: 100vh;
  overflow: hidden;
}

canvas#starfield {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* 四象限分隔线 */
.hero::before, .hero::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.04);
  pointer-events: none;
}
.hero::before {
  top: 50%; left: 0; right: 0; height: 1px;
  transform: translateY(-50%);
}
.hero::after {
  left: 50%; top: 0; bottom: 0; width: 1px;
  transform: translateX(-50%);
}

/* ── 七星容器：左上象限，靠近中心交叉点 ── */
.constellation {
  position: absolute;
  top: 20%; left: 16%;
  width: 52%; height: 54%;
  z-index: 10;
}

.constellation svg.lines-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.constellation svg.lines-svg line {
  stroke: rgba(255,255,255,0.08);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}

/* 五角星形状 */
.star {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 15;
}
.star-dot {
  width: 14px; height: 14px;
  background: rgba(210,220,240,0.35);
  clip-path: polygon(
    50% 0%, 61% 35%, 98% 35%,
    68% 57%, 79% 91%, 50% 70%,
    21% 91%, 32% 57%, 2% 35%, 39% 35%
  );
  transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
  transform-origin: center;
}
.star[data-size="lg"] .star-dot { width: 18px; height: 18px; }
.star[data-size="md"] .star-dot { width: 14px; height: 14px; }
.star[data-size="sm"] .star-dot { width: 11px; height: 11px; }

.star:hover .star-dot { transform: scale(1.3); filter: brightness(1.4); }

.star.lighted .star-dot {
  /* color set inline by JS */
}

/* tooltip */
.star-tooltip {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: rgba(8,12,24,0.9);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 0.4rem 0.8rem;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}
.star:hover .star-tooltip {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.tooltip-name  { font-size: 0.88rem; font-weight: 600; letter-spacing: 0.1em; }
.tooltip-en    { font-size: 0.62rem; color: rgba(232,228,223,0.5); margin-left: 0.3em; }
.tooltip-role  { font-size: 0.68rem; color: rgba(232,228,223,0.6); margin-top: 2px; }

/* ── 北极星 ── */
.polaris {
  position: absolute;
  z-index: 20;
  cursor: default;
}
.polaris-dot {
  width: 16px; height: 16px;
  background: rgba(220,235,255,1);
  clip-path: polygon(
    50% 0%, 61% 35%, 98% 35%,
    68% 57%, 79% 91%, 50% 70%,
    21% 91%, 32% 57%, 2% 35%, 39% 35%
  );
  box-shadow:
    0 0 8px 3px rgba(200,225,255,0.6),
    0 0 20px 5px rgba(200,225,255,0.25);
  animation: polaris-breathe 3s ease-in-out infinite;
}
@keyframes polaris-breathe {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 8px 3px rgba(200,225,255,0.6),
      0 0 20px 5px rgba(200,225,255,0.25),
      0 0 30px 8px rgba(200,225,255,0.15);
  }
  50% {
    transform: scale(1.35);
    box-shadow:
      0 0 18px 6px rgba(220,240,255,1),
      0 0 45px 12px rgba(220,240,255,0.5),
      0 0 80px 22px rgba(220,240,255,0.3);
  }
}

/* 隐藏北极星标签 */
.polaris-label { display: none; }

/* ── 剑图标（footer 上方、北斗下方）── */
.sword-icon {
  position: absolute;
  top: calc(80% - 62px);
  left: 50%;
  transform: translateX(-50%) translateY(-50%) rotate(0deg);
  width: 96px;
  height: 96px;
  pointer-events: none;
  z-index: 50;
  opacity: 0.85;
  animation: sword-breathe 3s ease-in-out infinite;
}
@keyframes sword-breathe {
  0%, 100% {
    transform: translateX(-50%) translateY(-50%) rotate(0deg) scale(1);
    filter: drop-shadow(0 0 8px rgba(26,200,145,0.4))
            drop-shadow(0 0 16px rgba(26,200,145,0.2));
  }
  50% {
    transform: translateX(-50%) translateY(-50%) rotate(0deg) scale(1.12);
    filter: drop-shadow(0 0 16px rgba(26,200,145,0.8))
            drop-shadow(0 0 32px rgba(26,200,145,0.4))
            drop-shadow(0 0 48px rgba(26,200,145,0.2));
  }
}

/* ── 博客窗口（四象限左下、右下正中） ── */
.blog-window {
  position: absolute;
  width: 280px;
  max-height: 220px;
  background: rgba(0,0,0,0.05);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  font-size: 0.7rem;
  line-height: 1.6;
  color: rgba(232,228,223,0.85);
  overflow-y: auto;
  z-index: 30;
  backdrop-filter: blur(2px);
}
.blog-window::-webkit-scrollbar { width: 4px; }
.blog-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.blog-window a {
  color: #1abc9c; text-decoration: none; border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.blog-window a:hover { border-color: #1abc9c; }
.blog-title {
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  color: #e8e4df;
  margin-bottom: 0.5rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.blog-item { margin: 0.35rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blog-item time { font-size: 0.6rem; color: rgba(232,228,223,0.3); margin-right: 0.5rem; }

/* 左下象限正中：光与影 (25%, 75%) */
.blog-window.gys {
  left: 25%;
  top: 75%;
  transform: translate(-50%, -50%);
}

/* 右下象限正中：开明作品 (75%, 75%) */
.blog-window.kmy {
  left: 75%;
  top: 75%;
  transform: translate(-50%, -50%);
}

/* ── footer ── */
.footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  text-align: center;
  padding: 0.8rem;
  font-size: 0.68rem;
  color: #e8e4df;
  letter-spacing: 0.15em;
  z-index: 100;
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="#">剑阁</a>
  <ul class="nav-links">
    <li><a href="/jiange/about">关于</a></li>
    <li><a href="/jiange/guangyuying">光与影</a></li>
    <li><a href="/guangyuying/journal">运营记录</a></li>
    <li><a href="/jiange/fengwu">风.物</a></li>
    <li><a href="/guangyuying/works">开明作品</a></li>
    <li><a href="/guangyuying/posts">文章</a></li>
  </ul>
</nav>

<div class="hero">
  <canvas id="starfield"></canvas>

  <!-- 七星：左上象限靠近中心 -->
  <div class="constellation" id="constellation">
    <svg class="lines-svg" id="lines-svg"></svg>
  </div>

  <!-- 北极星 -->
  <div class="polaris" id="polaris">
    <div class="polaris-dot" id="polaris-dot"></div>
  </div>

  <!-- 剑图标：lawseast.com 的剑，剑尖朝下、2倍大、呼吸发光 -->
  <img class="sword-icon" src="sword-hero.png" alt="承影之剑" />

  <!-- 博客窗口：左下象限正中 - 光与影 -->
  <div class="blog-window gys" id="blog-gys">
    <div class="blog-title">光与影 · 最近</div>
    <div class="blog-list" id="gys-list"></div>
  </div>

  <!-- 博客窗口：右下象限正中 - 开明作品 -->
  <div class="blog-window kmy" id="blog-kmy">
    <div class="blog-title">开明作品 · 最近</div>
    <div class="blog-list" id="kmy-list"></div>
  </div>
</div>

<div class="footer">剑阁 · 2026 · Umbriel</div>

<script>
// ── 七星：源自 urs.png 实际像素坐标，水平镜像后映射到 hero 容器 ──
// 闪烁顺序：摇光→开阳→玉衡→天权→天玑→天璇→天枢
// 颜色对应：摇光=红，开阳=橙，玉衡=黄，天权=绿，天玑=青，天璇=蓝，天枢=紫
const stars = [
  // 天枢 Dubhe  — 斗勺前右，靠近象限交叉点（右下）— 紫
  { name:'天枢', en:'Dubhe',   role:'指挥调度 · L3', x:67, y:36, size:'md', color:'#9b59b6' },
  // 天璇 Merak  — 斗勺前左 — 蓝
  { name:'天璇', en:'Merak',   role:'技术执行 · L2', x:61, y:50, size:'sm', color:'#3498db' },
  // 天玑 Phecda — 斗勺后左 — 青
  { name:'天玑', en:'Phecda',  role:'建元规划 · L2', x:52, y:44, size:'sm', color:'#1abc9c' },
  // 天权 Megrez — 斗勺后右，勺柄起点 — 绿
  { name:'天权', en:'Megrez',  role:'记忆知识 · L3', x:53, y:30, size:'md', color:'#2ecc71' },
  // 玉衡 Alioth — 勺柄第一节 — 黄
  { name:'玉衡', en:'Alioth',  role:'元和平衡 · L2', x:46, y:17, size:'lg', color:'#f1c40f' },
  // 开阳 Mizar  — 勺柄第二节 — 橙
  { name:'开阳', en:'Mizar',   role:'好汉行动 · L2', x:37, y:7, size:'md', color:'#e67e22' },
  // 摇光 Alkaid — 勺柄末端，最左上 — 红
  { name:'摇光', en:'Alkaid',  role:'媒体光芒 · L2', x:25, y:6, size:'md', color:'#e74c3c' },
];

// 连线：斗勺 [0,1,2,3] + 勺柄 [3→4→5→6]
const lines = [
  [0,1],[1,2],[2,3],[3,0],  // 斗勺
  [3,4],[4,5],[5,6],         // 勺柄
];

const container = document.getElementById('constellation');
const svgLines  = document.getElementById('lines-svg');

// 画连线
lines.forEach(([a,b]) => {
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1', stars[a].x+'%');
  l.setAttribute('y1', stars[a].y+'%');
  l.setAttribute('x2', stars[b].x+'%');
  l.setAttribute('y2', stars[b].y+'%');
  svgLines.appendChild(l);
});

// 画星
const starEls = [];
stars.forEach((s,i) => {
  const el = document.createElement('div');
  el.className = 'star';
  el.dataset.idx = i;
  el.dataset.size = s.size;
  el.style.left = s.x + '%';
  el.style.top  = s.y + '%';
  el.innerHTML = `
    <div class="star-dot"></div>
    <div class="star-tooltip">
      <span class="tooltip-name">${s.name}</span>
      <span class="tooltip-en">${s.en}</span>
      <div class="tooltip-role">${s.role}</div>
    </div>`;
  container.appendChild(el);
  starEls.push(el);
});

// ── 依次闪烁动画：从摇光(索引6)开始，依次向右/向前 ──
let current = stars.length - 1; // 6 = 摇光
const INTERVAL = 700;

function flashNext() {
  // 全部熄灭回底色
  starEls.forEach((el, i) => {
    el.classList.remove('lighted');
    const dot = el.querySelector('.star-dot');
    dot.style.background  = 'rgba(210,220,240,0.35)';
    dot.style.boxShadow   = 'none';
    el.querySelector('.tooltip-name').style.color = '';
  });

  // 只点亮当前这颗
  const s = stars[current];
  const el = starEls[current];
  el.classList.add('lighted');
  const dot = el.querySelector('.star-dot');
  dot.style.background  = s.color;
  dot.style.boxShadow   = `0 0 14px 4px ${s.color}cc, 0 0 35px 10px ${s.color}44`;
  el.querySelector('.tooltip-name').style.color = s.color;

  // 索引递减：6→5→4→3→2→1→0→6...
  current = (current - 1 + stars.length) % stars.length;
}

setInterval(flashNext, INTERVAL);
flashNext(); // 立即开始

// ── 北极星位置：hero 右上区域
const polarisGroup = document.getElementById('polaris');
polarisGroup.style.left = '62%';
polarisGroup.style.top  = '11%';

// ── 博客窗口数据加载（模拟数据，实际可替换为 fetch API）──
const mockPosts = {
  gys: [
    { title: '缘起性空之 缘起-1 你的名字', url: '/jiange/guangyuying/posts/yuanqi-1-name', date: '2026-08-29' },
    { title: '缘起性空之 缘起-2 灵智', url: '/jiange/guangyuying/posts/yuanqi-2-lingzhi', date: '2026-08-29' },
    { title: '缘起性空之 性空-2 摩尼宝珠', url: '/jiange/guangyuying/posts/xingkong-2-moni', date: '2026-08-30' },
    { title: '起号养号方案', url: '/jiange/guangyuying/posts/startup-plan', date: '2026-08-28' },
    { title: '光与影发布计划-执行规划', url: '/jiange/guangyuying/posts/release-plan', date: '2026-08-25' },
  ],
  kmy: [
    { title: '承影名字缘起：从十大名剑到 Umbriel', url: '/jiange/guangyuying/works/chengying-name', date: '2026-08-29' },
    { title: '灵智：给 AI 一个东方的名字', url: '/jiange/guangyuying/works/lingzhi', date: '2026-08-29' },
    { title: '摩尼宝珠：东方智慧的图腾', url: '/jiange/guangyuying/works/moni', date: '2026-08-30' },
    { title: '剑阁架构设计', url: '/jiange/guangyuying/works/architecture', date: '2026-08-28' },
    { title: '七星协作协议', url: '/jiange/guangyuying/works/protocol', date: '2026-08-25' },
  ]
};

function renderBlogList(id, posts) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = posts.map(p => `
    <div class="blog-item">
      <time>${p.date}</time>
      <a href="${p.url}" target="_blank">${p.title}</a>
    </div>
  `).join('');
}

renderBlogList('gys-list', mockPosts.gys);
renderBlogList('kmy-list', mockPosts.kmy);

// 简单的自动滚动翻页（可选：每 8 秒滚动一条）
function autoScroll(listId, posts) {
  const list = document.getElementById(listId);
  if (!list) return;
  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % posts.length;
    list.scrollTop = idx * 28; // 每项约 28px
  }, 8000);
}
autoScroll('gys-list', mockPosts.gys);
autoScroll('kmy-list', mockPosts.kmy);

</script>

<script>
// ── 背景星场 ──
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let W, H, bgStars = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 300; i++) {
  bgStars.push({
    x: Math.random() * 2400,
    y: Math.random() * 1600,
    r: Math.random() * 1.1 + 0.15,
    baseA: Math.random() * 0.35 + 0.1,
    speed: Math.random() * 0.015 + 0.003,
    offset: Math.random() * Math.PI * 2,
  });
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  bgStars.forEach(s => {
    const a = s.baseA + Math.sin(time * s.speed + s.offset) * 0.12;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(210,220,240,${Math.max(0, a)})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
